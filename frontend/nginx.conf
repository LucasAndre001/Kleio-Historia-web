# Nginx do frontend Kleio História.
# - Serve o Angular compilado.
# - Encaminha /api e /uploads para o container da API ("api" é o nome do
#   serviço no docker-compose). Assim navegador e API ficam na mesma origem.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # PDFs de até 20 MB (com folga para o multipart)
    client_max_body_size 25m;

    # Cabeçalhos básicos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # "^~" dá prioridade a estes prefixos sobre a regra de arquivos estáticos abaixo
    # (sem ele, /uploads/imagens/foto.jpg cairia na regra de .jpg e daria 404).
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # PDFs grandes podem levar alguns segundos
    }

    location ^~ /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Arquivos com hash no nome (main-ABC123.js) podem ficar em cache por muito tempo.
    location ~* \.(js|css|woff2?|ico|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer outra rota (ex.: /artigos/revolucao-francesa) devolve o index.html
    # e o Angular Router decide o que mostrar.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
