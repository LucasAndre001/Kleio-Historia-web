# Verificação automática (apenas build e testes — NÃO faz deploy).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar, compilar e testar
        working-directory: backend
        run: |
          dotnet restore KleioHistoria.slnx
          dotnet build KleioHistoria.slnx -c Release --no-restore
          dotnet test KleioHistoria.slnx -c Release --no-build --verbosity normal

  frontend:
    name: Frontend (Angular 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar e compilar
        working-directory: frontend
        run: |
          npm ci
          npx ng build --configuration production

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagens (sem publicar)
        run: |
          cp .env.example .env
          docker compose build
